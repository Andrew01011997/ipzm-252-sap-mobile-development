<ion-item class="todo-item" lines="none" [class.completed]="todo().completed">
  <ion-checkbox
    slot="start"
    [checked]="todo().completed"
    [aria-label]="todo().title"
    (ionChange)="completionToggled.emit()"
  ></ion-checkbox>
  <ion-label class="ion-text-wrap">
    <h2 class="title">{{ todo().title }}</h2>
    @if (todo().description) {
      <p class="description">{{ todo().description }}</p>
    }
    @if (todo().dueDate; as dueDate) {
      <span class="due" [class.overdue]="isOverdue()">
        <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
        {{ dueDate | date: 'd MMM, HH:mm' }}
      </span>
    }
  </ion-label>
  @if (todo().photo; as photo) {
    <img class="thumb" slot="end" [src]="photo.url" alt="" loading="lazy" />
  }
  <ion-button
    class="remove"
    slot="end"
    fill="clear"
    color="medium"
    [attr.aria-label]="'todos.item.remove' | translate"
    (click)="removeRequested.emit()"
  >
    <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
  </ion-button>
</ion-item>
