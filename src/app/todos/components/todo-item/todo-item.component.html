<ion-item class="todo-item" lines="none" [class.completed]="todo().completed">
  <ion-checkbox
    slot="start"
    [checked]="todo().completed"
    [aria-label]="todo().title"
    (ionChange)="completionToggled.emit()"
  ></ion-checkbox>
  <ion-label class="ion-text-wrap">
    <h2 class="title">{{ todo().title }}</h2>
    @if (todo().description) {
      <p class="description">{{ todo().description }}</p>
    }
  </ion-label>
  <ion-button
    class="remove"
    slot="end"
    fill="clear"
    color="medium"
    [attr.aria-label]="'todos.item.remove' | translate"
    (click)="removeRequested.emit()"
  >
    <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
  </ion-button>
</ion-item>
