<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button color="medium" [defaultHref]="listUrl"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'todos.form.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="app-container page">
    <header class="page-head">
      <h1 class="page-title">{{ 'todos.form.title' | translate }}</h1>
      <p class="page-subtitle">{{ 'todos.form.subtitle' | translate }}</p>
    </header>

    <form id="todo-form" class="todo-form" [formGroup]="form" (ngSubmit)="save()">
      <ion-input
        formControlName="title"
        fill="outline"
        labelPlacement="floating"
        autocapitalize="sentences"
        enterkeyhint="next"
        [label]="'todos.form.titleLabel' | translate"
        [errorText]="'todos.form.errors.titleRequired' | translate"
        [maxlength]="titleMaxLength"
        [counter]="true"
      ></ion-input>

      <ion-textarea
        formControlName="description"
        fill="outline"
        labelPlacement="floating"
        autocapitalize="sentences"
        [label]="'todos.form.descriptionLabel' | translate"
        [maxlength]="descriptionMaxLength"
        [counter]="true"
        [autoGrow]="true"
        [rows]="5"
      ></ion-textarea>
    </form>
  </div>
</ion-content>

<ion-footer class="form-footer">
  <ion-toolbar>
    <div class="app-container footer-actions">
      <ion-button type="submit" form="todo-form" expand="block" [disabled]="saving()">
        {{ 'todos.form.save' | translate }}
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
