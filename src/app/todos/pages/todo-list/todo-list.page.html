<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{ 'todos.list.title' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button [attr.aria-label]="'auth.logout' | translate" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ 'todos.list.title' | translate }}</ion-title>
    </ion-toolbar>
  </ion-header>

  @if (showEmptyState()) {
  <div class="empty-state">
    <ion-icon name="clipboard-outline" aria-hidden="true"></ion-icon>
    <h2>{{ 'todos.list.empty' | translate }}</h2>
    <ion-text color="medium">
      <p>{{ 'todos.list.emptyHint' | translate }}</p>
    </ion-text>
  </div>
  } @else {
  <ion-list>
    @for (todo of store.todos(); track todo.id) {
    <app-todo-item [todo]="todo" (completionToggled)="toggle(todo)" (removeRequested)="confirmRemoval(todo)" />
    }
  </ion-list>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="new" routerDirection="forward" [attr.aria-label]="'todos.list.add' | translate">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
