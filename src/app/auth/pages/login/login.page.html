<ion-header class="auth-header" [translucent]="true">
  <ion-toolbar>
    <div class="app-brand">
      <span class="app-brand-mark"><ion-icon name="checkmark-done-outline" aria-hidden="true"></ion-icon></span>
      {{ 'app.name' | translate }}
    </div>
    <app-language-switcher slot="end" />
  </ion-toolbar>
</ion-header>

<ion-content class="auth-page" [fullscreen]="true">
  <div class="auth-layout">
    <section class="auth-card">
      <h1 class="auth-heading">{{ 'auth.login.heading' | translate }}</h1>
      <p class="auth-subtitle">{{ 'auth.login.subtitle' | translate }}</p>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <ion-input
          mode="md"
          formControlName="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          fill="outline"
          labelPlacement="floating"
          [label]="'auth.fields.email' | translate"
          [errorText]="form.controls.email.errors | validationMessage: emailMessages"
        ></ion-input>

        <ion-input
          mode="md"
          formControlName="password"
          type="password"
          autocomplete="current-password"
          fill="outline"
          labelPlacement="floating"
          [label]="'auth.fields.password' | translate"
          [errorText]="form.controls.password.errors | validationMessage: passwordMessages"
        >
          <ion-input-password-toggle slot="end" color="medium"></ion-input-password-toggle>
        </ion-input>

        <a
          class="auth-link forgot-link"
          routerLink="/auth/forgot-password"
          [queryParams]="{ email: form.controls.email.value || null }"
          >{{ 'auth.login.forgotPassword' | translate }}</a
        >

        <ion-button class="auth-submit" type="submit" expand="block" [disabled]="submitting()">
          {{ 'auth.login.submit' | translate }}
        </ion-button>
      </form>

      <app-google-sign-in />

      <p class="auth-footer">
        {{ 'auth.login.noAccount' | translate }}
        <a class="auth-link" routerLink="/auth/sign-up">{{ 'auth.login.signUp' | translate }}</a>
      </p>
    </section>
  </div>
</ion-content>
